  <style>
    /* ── Intro screen wrapper ── */
    #intro-screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      transition: opacity 1.2s ease, visibility 1.2s ease;
      opacity: 1;
      visibility: visible;
    }
    #intro-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* ── Love Rain screen ── */
    #love-rain-screen {
      position: fixed;
      inset: 0;
      z-index: 5;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.2s ease 0.6s, visibility 1.2s ease 0.6s;
      background: #0a0512;
    }
    #love-rain-screen.visible {
      opacity: 1;
      visibility: visible;
    }
    #love-rain-screen #starry-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ── Watermark chéo Xem Demo (chống ghi hình khi chưa thanh toán) ── */
    .demo-watermark {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 99999;
      pointer-events: none;
      user-select: none;
      background-repeat: repeat;
      background-position: 0 0;
    }
  </style>

  <!-- Chặn DevTools -->
  <script src="js/detect-devtools.js"></script>
  <script type="text/javascript">
    // Bypass for developers
    const keyName = 'key';
    const keyValue = '9ac7ec230e0e4513578f309d6d3579ad';

    // Handle via config
    DisableDevtool({
      tkName: keyName,
      md5: keyValue,

</head>

<body>

  <!-- Watermark "Xem Demo" chéo bảo vệ bản quyền -->
  <div id="demo-watermark" class="demo-watermark" style="display:none"></div>

  <!-- ══════════════════════════════════════
       INTRO SCREEN
       ══════════════════════════════════════ -->
  <div id="intro-screen">

    <!-- Loading overlay -->
    <div id="loading-overlay">
      <div class="loading-title">Đang chuẩn bị yêu thương gửi Chi...</div>
      <div class="loading-heart">💕</div>
      <div class="loading-text">Đang chuẩn bị quà 20/10 cho Chi...</div>
      <div class="loading-bar"><div class="loading-progress" id="loading-progress"></div></div>
      <div class="loading-percent" id="loading-percent">0%</div>
    </div>

    <!-- Tap hint -->
    <div class="tap-hint" id="tapHint" style="display:none">
      <div class="tap-hint-content">
        <div class="tap-hint-arrow">↑</div>
        <div class="tap-hint-text">Chạm vào để xem quà 20/10 nhé Chi 💖</div>
        <div class="tap-hint-icon"></div>
      </div>
    </div>

    <!-- Start button -->
    <div id="start-wrap">
      <div id="start-label">Nhấn giữ để bắt đầu</div>
      <svg viewBox="0 0 68 68" aria-hidden="true">
        <circle class="ring-pulse" cx="34" cy="34" r="28"/>
        <circle class="ring-track" cx="34" cy="34" r="26"/>
        <circle class="ring-fill"  id="ring-fill" cx="34" cy="34" r="26"/>
      </svg>
    </div>

    <div id="text-container"></div>
    <div class="shooting-stars" id="shooting-stars"></div>

  </div><!-- /#intro-screen -->


  <!-- ══════════════════════════════════════
       LOVE RAIN SCREEN (ẩn, hiện sau intro)
       ══════════════════════════════════════ -->
  <div id="love-rain-screen">
    <canvas id="starry-canvas"></canvas>
    <div class="shooting-stars" id="shooting-stars-rain"></div>

    <div
      id="app"
      data-page='{
        "component": "views/home",
        "props": {
          "errors": {},
          "name": "Chi",
          "quote": {
            "message": "Chúc mừng ngày Phụ nữ Việt Nam 20/10!",
            "author": "Gửi Chi 💕"
          },
          "message": "Chúc mừng ngày 20/10 nhé Chi! 💐",
          "client": {
            "fontName": "Mali",
            "color": "#ff6b9d",
            "messages": [
              "Chúc mừng ngày 20/10, Chi nhé! 💐",
              "Chúc Chi luôn xinh đẹp, rạng rỡ và hạnh phúc 💕",
              "Mỗi ngày của Chi đều ngập tràn niềm vui ✨",
              "Mong những điều ngọt ngào nhất luôn đến với Chi 🌸"
            ],
            "music": "assets/music/cho-anh-chut-thoi.mp3",
            "images": [
              "assets/image/chi1.png",
              "assets/image/chi2.jpg",
              "assets/image/chi3.jpg",
              "assets/image/chi4.png",
              "assets/image/chi5.jpg"
            ]
          },
          "clientId": "/"
        },
        "url": "/",
        "version": "",
        "clearHistory": false,
        "encryptHistory": false
      }'
    ></div>
  </div><!-- /#love-rain-screen -->

  <!-- ══════════════════════════════════════
       MÀN CHỜ TẢI DỮ LIỆU (Loading Screen Overlay)
       Hiển thị giữa Intro và Love Rain
       ══════════════════════════════════════ -->
  <div
    id="transition-loading-overlay"
    class="loading-overlay"
    hidden
    role="status"
    aria-live="polite"
    aria-busy="true"
    aria-label="Đang tải dữ liệu"
  >
    <div class="loading-card">
      <p class="loading-title" id="loading-title">Đang chuẩn bị điều bất ngờ 💕</p>
      <p class="loading-sub" id="loading-sub">Đang tải ảnh và câu chúc...</p>
      <div class="loading-track" aria-hidden="true">
        <div id="loading-bar" class="loading-bar" style="width: 0%"></div>
      </div>
      <p class="loading-pct" id="loading-pct">0%</p>
    </div>
  </div>


  <!--
    ┌─────────────────────────────────────────────────────────┐
    │  Script load order (quan trọng — đừng đổi thứ tự)      │
    │  0. app-config.js — cấu hình API base URL              │
    │  1. data-init.js  — khởi tạo window.Heartlove, v.v.    │
    │  2. shooting-stars.js — tạo sao băng trên DOM           │
    │  3. enhanced-effects.js — Three.js particle engine      │
    │  4. start-button.js — nút giữ/chạm để bắt đầu          │
    └─────────────────────────────────────────────────────────┘
  -->
  <script src="lib/app-config.js"></script>
  <script src="js/preview-storage.js"></script>
  <script src="js/data-init.js"></script>
  <script src="js/shooting-stars.js"></script>
  <script type="module" src="js/enhanced-effects.js"></script>
  <script src="js/start-button.js"></script>

  <!-- Module quản lý Màn chờ Tải Dữ liệu (theo LOADING_SCREEN_GUIDE.md) -->
  <script src="js/loading-manager.js"></script>

  <!-- Chuyển sang màn Love Rain khi hiệu ứng chữ kết thúc -->
  <script>
    window.addEventListener('textMessagesComplete', async function () {
      var intro    = document.getElementById('intro-screen');
      var loveRain = document.getElementById('love-rain-screen');

      // 1. Mở màn hình chờ LoadingScreen (z-index 9999) ngay lập tức
      // Che phủ toàn màn hình, xóa bỏ hoàn toàn hiện tượng màn hình đen
      LoadingScreen.show('Đang chuẩn bị điều bất ngờ cho Chi 💕', 'Đang kết nối yêu thương...');
      LoadingScreen.setProgress(15);

      // Fade out và ẩn intro screen phía sau loading overlay
      if (intro) {
        intro.classList.add('fade-out');
        setTimeout(function () {
          intro.style.display = 'none';
        }, 1000);
      }

      // Kích hoạt love-rain screen sẵn sàng phía dưới loading
      if (loveRain) {
        loveRain.classList.add('visible');
      }

      try {
        // 2. Chờ Promise dữ liệu từ API nếu có (15% -> 35%)
        LoadingScreen.setMessage('Đang đọc lời chúc 20/10 dành cho Chi...');
        LoadingScreen.setProgress(25);
        if (window._fallingLoveReady) {
          await Promise.race([
            window._fallingLoveReady,
            new Promise(function (r) { setTimeout(r, 2000); })
          ]);
        }
        LoadingScreen.setProgress(35);

        // 3. Lấy danh sách ảnh cần tải trước
        var defaultPhotos = [
          "assets/image/chi1.png",
          "assets/image/chi2.jpg",
          "assets/image/chi3.jpg",
          "assets/image/chi4.png",
          "assets/image/chi5.jpg"
        ];
        var photoUrls = defaultPhotos;
        if (window.LOVEGIFT_IMAGES && window.LOVEGIFT_IMAGES.length > 0) {
          photoUrls = window.LOVEGIFT_IMAGES;
        } else if (window.FallingLoveData && window.FallingLoveData.images && window.FallingLoveData.images.length > 0) {
          photoUrls = window.FallingLoveData.images;
        } else if (window.Heartlove && window.Heartlove.data && window.Heartlove.data.images && window.Heartlove.data.images.length > 0) {
          photoUrls = window.Heartlove.data.images;
        }

        // 4. Preload toàn bộ ảnh vào cache trình duyệt (35% -> 70%)
        if (photoUrls && photoUrls.length > 0 && !window.LOVEGIFT_NO_IMAGES) {
          LoadingScreen.setMessage('Đang tải hình ảnh kỷ niệm (0/' + photoUrls.length + ')...');
          var loaded = 0;
          await Promise.all(
            photoUrls.map(async function (url) {
              await LoadingScreen.preloadImage(url);
              loaded++;
              var pct = 35 + Math.round((loaded / photoUrls.length) * 35);
              LoadingScreen.setProgress(pct);
              LoadingScreen.setMessage('Đang tải hình ảnh kỷ niệm (' + loaded + '/' + photoUrls.length + ')...');
            })
          );
        } else {
          LoadingScreen.setProgress(70);
        }

        // 5. Nạp scripts: loader.js và starry-sky.js (70% -> 85%)
        LoadingScreen.setMessage('Khởi tạo bầu trời ngàn sao...');
        LoadingScreen.setProgress(75);

        await Promise.all([
          LoadingScreen.loadScript('js/loader.js'),
          LoadingScreen.loadScript('js/starry-sky.js', true)
        ]);
        LoadingScreen.setProgress(85);

        // 6. Chờ canvas của cảnh mưa tình yêu xuất hiện trong DOM (85% -> 98%)
        LoadingScreen.setMessage('Chuẩn bị mưa yêu thương dành cho Chi...');
        await new Promise(function (resolve) {
          var attempts = 0;
          var checkTimer = setInterval(function () {
            attempts++;
            var app = document.getElementById('app');
            var hasCanvas = app && app.querySelector('canvas');
            if (hasCanvas || attempts >= 35) { // tối đa ~3.5s
              clearInterval(checkTimer);
              resolve();
            }
          }, 100);
        });

        LoadingScreen.setProgress(100);
        LoadingScreen.setMessage('Món quà 20/10 cho Chi đã sẵn sàng! 💕');
        await LoadingScreen.waitFrames(4);

        // 7. Mở màn hình Love Rain: Dữ liệu và hình ảnh đã sẵn sàng hiển thị luôn!
        setTimeout(function () {
          LoadingScreen.hide();
        }, 350);

      } catch (err) {
        console.error('Lỗi trong quá trình chuẩn bị màn cuối:', err);
        LoadingScreen.setProgress(100);
        setTimeout(function () {
          LoadingScreen.hide();
        }, 400);
      }
    }, { once: true });
  </script>

  <!-- Script kích hoạt Watermark chéo khi ở chế độ Xem Demo -->
  <script>
    (function initWatermark() {
      var params = new URLSearchParams(window.location.search);
      var isPreview = params.has('preview') || params.has('demo');
      if (!isPreview) return;

      var wm = document.getElementById('demo-watermark');
      if (!wm) return;

      try {
        var canvas = document.createElement('canvas');
        canvas.width = 300;
        canvas.height = 190;
        var ctx = canvas.getContext('2d');
        if (ctx) {
          ctx.translate(150, 95);
          ctx.rotate(-28 * Math.PI / 180);

          // Đường viền hồng nhạt
          ctx.font = 'bold 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.strokeStyle = 'rgba(255, 105, 180, 0.28)';
          ctx.lineWidth = 2.5;
          ctx.strokeText('Xem Demo', 0, 0);

          // Lớp chữ trắng mờ
          ctx.fillStyle = 'rgba(255, 255, 255, 0.24)';
          ctx.fillText('Xem Demo', 0, 0);

          wm.style.backgroundImage = 'url(' + canvas.toDataURL('image/png') + ')';
        }
      } catch (e) {
        console.warn('Lỗi tạo watermark:', e);
      }

      wm.style.display = 'block';
    })();
  </script>

</body>
